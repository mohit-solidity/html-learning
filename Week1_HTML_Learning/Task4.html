<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>
<body>
    <form>
        <!--Inpput Tasks-->
        <label>Name :</label>
        <input type="text" placeholder="Enter Your Name" required/><br><br>
        <label>Email :</label>
        <input type="email" placeholder="Enter Your Email" required /><br><br>
        <label>Phone Number : </label>
        <input type="tel" placeholder="Enter Your Phone Number" /><br><br>
        <label>Gender : </label>
        <input type="radio" name="gender" value="male" />Male
        <input type="radio" name="gender" value="female" />Female
        <input type="radio" name="gender" value="other" />Other<br><br>
        <label>Date Of Birth : </label>
        <input type="date" /><br><br>
        <label>Course Selection : </label>
        <select>
            <option>Choose Option</option>
            <option>Computer Science</option>
            <option>Electronics</option>
            <option>Civil</option>
        </select><br><br>
        <label>Address : </label>
        <input type="text" placeholder="Address" /><br><br>

        <!--check Box-->
        <label>Skills : </label>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">JavaScript<br><br>

        <!--Radio Buttons-->
        <label>Interest : </label>
        <input type="radio" name="interest" value="frontend"/>Frontend
        <input type="radio" name="interest" value="backend"/>Backend
        <input type="radio" name="interest" value="fullstack"/>Full Stack<br><br>

        <!--Dropdown Box-->
        <label>Main Language : </label>
        <select>
            <option>Choose Option</option>
            <option>HTML5</option>
            <option>CSS</option>
            <option>JavaScript</option>
        </select><br><br>

        <!--Submit Buttons-->
        <button type="submit" value="submit">Submit Data</button>

        <!--Reset Button-->
        <button type="reset" value="reset">Reset Data</button>
    </form>
</body>
</html>
