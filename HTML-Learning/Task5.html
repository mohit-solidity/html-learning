<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
</head>
<body>
    <!--Header = Top Part Of The Website-->
    <header>
        <h1>This Is header Tag</h1>
        <!--Nav = navigation Link Used To Navigate To Links Provided-->
        <nav>
            <a href="#about">About</a>
            <a href="#contact">Contact</a> 
        </nav>
    </header>
    <!--main = Main Content Of The Page-->
    <main>
        <!--Section = A Section/Portion Of Related Content-->
        <section id="about">
            <h1>About Me</h1>
            <!--Article = Used Inside Section To Define A Complete Blog or Post. We Can Have Multiple Articles Inside Section-->
            <article>
                <p>Hey All. Welcome To My Website.<br>In This Website, I'm learning How To Buiild A Simple Website using HTML5 And Learning All HTML5 Tags And Everything.<br>Thanks For Seeing This</p>
                <p>My Name Is Mohit. From Earth</p>
            </article>
        </section>
        <section id="contact">
            <h1>Contact Me</h1>
            <article>
                <input type="text" placeholder="Enter Your Proposal">
                <input type="submit">
            </article>
        </section>
    </main>
    <!--Footer = Bottom Of The Page Particularly Used For - Copyright, Contact info, etc...-->
    <footer>
        <p>© 2026. All Rights Reserved</p>
    </footer>
</body>
</html>
