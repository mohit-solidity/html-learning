<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mohit Sharma - Events</title>
  </head>

  <body>
    <h1 id="title">Mohit Sharma</h1>

    <p id="message">Web Developer learning Web3 and Blockchain Development.</p>

    <button id="helloButton">Click Me</button>

    <br /><br />

    <input type="text" id="nameInput" placeholder="Enter your name" />

    <p id="inputMessage"></p>

    <br />

    <label for="skill">Choose a skill:</label>

    <select id="skill">
      <option value="">Select Skill</option>
      <option value="HTML">HTML</option>
      <option value="CSS">CSS</option>
      <option value="JavaScript">JavaScript</option>
      <option value="React">React</option>
      <option value="Solidity">Solidity</option>
    </select>

    <p id="skillMessage"></p>

    <br />

    <form id="contactForm">
      <input type="text" id="formName" placeholder="Enter your name" required />

      <button type="submit">Submit</button>
    </form>

    <p id="formMessage"></p>

    <br />

    <div id="mouseBox" style="padding: 30px; border: 1px solid black">
      Move your mouse over this box
    </div>

    <br />

    <input type="text" id="keyInput" placeholder="Type something here" />

    <p id="keyMessage"></p>

    <script src="task5.js"></script>
  </body>
</html>
