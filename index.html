<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="Week6_Github_Learning/style.css">
    <link rel="icon" type="image/svg" href="Week6_Github_Learning/assest/image.svg">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#add">Add Student</a>
            <a href="#students">Students</a>
        </nav>
    </header>

    <main>

        <section id="home" class="intro">
            <h2>Manage Student Records</h2>
            <p>
                Add, search and manage student records easily.
            </p>
        </section>

        <section id="add">
            <h2>Add Student</h2>

            <form id="studentForm">

                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter name" required>
                </div>

                <div>
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter age" required>
                </div>

                <div>
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter course" required>
                </div>

                <div>
                    <label for="marks">Marks</label>
                    <input type="number" id="marks" placeholder="Enter marks" required>
                </div>

                <button type="submit">Add Student</button>

            </form>
        </section>

        <section id="students">

            <h2>Student Records</h2>

            <div class="search">
                <input
                    type="text"
                    placeholder="Search student"
                >
            </div>

            <div class="cards">
                
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Mohit Sharma</p>
    </footer>

    <script src="Week6_Github_Learning/script.js"></script>

</body>
</html>
